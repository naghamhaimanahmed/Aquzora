<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Ruqaa; src: url(fonts/aref-ruqaa-atr-subset-700.woff2); font-weight: 700; }
@font-face { font-family: Cinzel; src: url(fonts/cinzel-latin-500.woff2); font-weight: 400 700; }
@font-face { font-family: Amiri; src: url(fonts/amiri-arabic-700.woff2); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+0660-0669; }
@font-face { font-family: Amiri; src: url(fonts/amiri-arabic-400.woff2); font-weight: 400; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+0660-0669; }
@font-face { font-family: Amiri; src: url(fonts/amiri-latin-700.woff2); font-weight: 400 700; unicode-range: U+0000-00FF, U+2000-206F; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { position: relative; font-family: Amiri, serif; color: #EDE6DA; }
.full { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.world { position: absolute; inset: 0; transform-origin: 50% 50%; }

/* bottle */
.bt { position: absolute; }
.bt .body { position: absolute; inset: 0; transform-style: preserve-3d; }
.bt .img { position: absolute; inset: 0; width: 100%; height: 100%; }
.bt .hl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bt .sheen { filter: brightness(1.9) saturate(.7); opacity: .22;
  -webkit-mask-image: linear-gradient(90deg, transparent 10%, #000 19%, transparent 28%, transparent 73%, rgba(0,0,0,.6) 81%, transparent 89%); mask-image: linear-gradient(90deg, transparent 10%, #000 19%, transparent 28%, transparent 73%, rgba(0,0,0,.6) 81%, transparent 89%); }
.bt .sweep { filter: brightness(2.6) saturate(.55); opacity: 0;
  -webkit-mask-image: linear-gradient(100deg, transparent 0%, transparent 43%, #000 50%, transparent 57%, transparent 100%); mask-image: linear-gradient(100deg, transparent 0%, transparent 43%, #000 50%, transparent 57%, transparent 100%);
  -webkit-mask-size: 320% 100%; mask-size: 320% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.bt .refl { position: absolute; left: 0; top: 100%; width: 100%; height: 100%; transform: scaleY(-1); transform-origin: 50% 50%; opacity: .26; filter: blur(1.5px);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 38%); mask-image: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 38%); }
.bt .shadow { position: absolute; left: -20%; right: -20%; top: calc(100% - 26px); height: 52px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.85), rgba(0,0,0,0)); filter: blur(6px); }

/* backgrounds */
.bg { position: absolute; inset: -10%; }
.cone { position: absolute; left: 50%; top: -120px; width: 1300px; height: 1700px; transform: translateX(-50%); clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
  background: linear-gradient(to bottom, rgba(255,232,196,.30), rgba(255,232,196,.06) 70%, rgba(255,232,196,0)); filter: blur(28px); mix-blend-mode: screen; }
.floor { position: absolute; left: -10%; right: -10%; height: 700px; background: linear-gradient(to bottom, rgba(255,255,255,.05), rgba(0,0,0,0) 40%); }
.smoke { position: absolute; width: 1500px; height: 2000px; background: url(tex/smoke.png) center / 100% 100% no-repeat; mix-blend-mode: screen; }

/* text */
.line { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; opacity: 0; }
.gold { background: linear-gradient(100deg, #A9823F 0%, #D4AF6A 30%, #FFF1CF 50%, #D4AF6A 70%, #A9823F 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
#t1a { top: 760px; font-size: 150px; line-height: 1.3; color: #EDE6DA; text-shadow: 0 0 40px rgba(255,220,170,.25); }
#t1b { top: 960px; font-size: 168px; line-height: 1.3; }
#t3 { top: 1600px; font-size: 76px; color: #EDE6DA; text-shadow: 0 2px 30px rgba(0,0,0,.8); }
#t6 { top: 230px; font-size: 104px; }
#logo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#mark { font: 700 360px/1 Ruqaa; padding: 40px 40px 10px; display: block; }
#atr { font: 500 112px/1 Cinzel; letter-spacing: .32em; margin-inline-start: .32em; direction: ltr; color: #EDE6DA; }
#maison { font: 500 28px/1 Cinzel; letter-spacing: .62em; margin-inline-start: .62em; color: #D4AF6A; margin-top: 26px; direction: ltr; }
#rule { width: 0; height: 1.5px; margin: 70px auto 0; background: linear-gradient(90deg, transparent, #D4AF6A, transparent); }
#cta { margin-top: 64px; display: inline-flex; align-items: center; gap: 22px; padding: 30px 62px 38px; border: 1.5px solid rgba(212,175,106,.85); border-radius: 999px; font: 700 72px/1 Amiri; color: #F3E3BC; background: rgba(212,175,106,.07); }
#cta svg { width: 62px; height: 62px; }
#phone { margin-top: 40px; font: 500 60px/1 Cinzel; letter-spacing: .1em; color: #EDE6DA; direction: ltr; unicode-bidi: isolate; }

/* overlays */
#beam { position: absolute; left: -400px; top: -600px; width: 220px; height: 3400px; background: linear-gradient(90deg, rgba(255,226,180,0), rgba(255,236,205,.55), rgba(255,226,180,0)); filter: blur(22px); mix-blend-mode: screen; opacity: 0; }
#leak { position: absolute; inset: -20%; mix-blend-mode: screen; opacity: 0; background: radial-gradient(circle at 30% 40%, rgba(255,170,90,.55), rgba(255,120,40,0) 45%); }
#flash { position: absolute; inset: 0; background: #FFF4E1; opacity: 0; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 62% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%); }
#grain { position: absolute; inset: -60px; background: url(tex/grain.png) 0 0 / 512px 512px; mix-blend-mode: overlay; opacity: .09; }
#fade { position: absolute; inset: 0; background: #000; opacity: 1; }
canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <!-- 1 hook -->
  <section class="scene" id="s1"><div class="world">
    <div class="bg" style="background: radial-gradient(ellipse 60% 40% at 50% 52%, #1d1611 0%, #0a0806 55%, #000 100%)"></div>
    <div class="smoke" id="s1smoke" style="left:-200px; top:900px; opacity:.16; filter: sepia(1) saturate(2.2) brightness(.9)"></div>
    <div class="line" id="t1a">عطرك…</div>
    <div class="line gold" id="t1b">توقيعك</div>
  </div></section>

  <!-- 2 rouge -->
  <section class="scene" id="s2"><div class="world">
    <div class="bg" style="background: radial-gradient(ellipse 55% 45% at 50% 38%, #4a1218 0%, #24080b 45%, #070203 85%)"></div>
    <div class="cone"></div>
    <div class="floor" style="top:1440px"></div>
    <div class="smoke" id="s2smoke" style="left:-300px; top:300px; opacity:.20; filter: sepia(1) hue-rotate(-30deg) saturate(3) brightness(.7)"></div>
    <div id="b2"></div>
  </div></section>

  <!-- 3 la'dor bakhur -->
  <section class="scene" id="s3"><div class="world">
    <div class="bg" style="background: radial-gradient(ellipse 60% 45% at 52% 40%, #10394a 0%, #081a24 45%, #020608 88%)"></div>
    <div class="bg" style="background: radial-gradient(circle at 18% 30%, rgba(255,200,130,.20), rgba(255,200,130,0) 35%)"></div>
    <div class="floor" style="top:1450px"></div>
    <div class="smoke" id="s3smokeA" style="left:-400px; top:700px; opacity:.22; filter: sepia(.6) hue-rotate(160deg) saturate(1.6) brightness(.9)"></div>
    <div class="smoke" id="s3smokeB" style="left:0px; top:1000px; opacity:.16; filter: sepia(.6) hue-rotate(160deg) saturate(1.6) brightness(.9)"></div>
    <div id="b3"></div>
    <div class="line" id="t3">حضورٌ لا يُنسى</div>
  </div></section>

  <!-- 4 kahilan on cream -->
  <section class="scene" id="s4"><div class="world">
    <div class="bg" style="background: radial-gradient(ellipse 60% 50% at 50% 40%, #FBF3E3 0%, #EADBBE 45%, #BFA27A 85%, #8E7350 100%)"></div>
    <div class="floor" style="top:1450px; background: linear-gradient(to bottom, rgba(120,90,50,.18), rgba(0,0,0,0) 45%)"></div>
    <div class="smoke" id="s4smoke" style="left:-250px; top:500px; opacity:.35; mix-blend-mode: soft-light"></div>
    <div id="b4"></div>
  </div></section>

  <!-- 5 montage -->
  <section class="scene" id="s5"><div class="world" id="w5">
    <div class="bg" id="s5bg" style="background: radial-gradient(ellipse 60% 50% at 50% 45%, #1c1610 0%, #050403 80%)"></div>
    <div id="b5"></div>
  </div></section>

  <!-- 6 group -->
  <section class="scene" id="s6"><div class="world" id="w6">
    <div class="bg" style="background: radial-gradient(ellipse 65% 48% at 50% 50%, #1f1913 0%, #0b0907 55%, #020202 90%)"></div>
    <div class="cone" style="width:1600px; height:1900px; opacity:.85"></div>
    <div class="floor" style="top:1520px; background: linear-gradient(to bottom, rgba(255,240,215,.07), rgba(0,0,0,0) 40%)"></div>
    <div class="smoke" id="s6smoke" style="left:-200px; top:1000px; opacity:.12; filter: sepia(1) saturate(1.8)"></div>
    <div id="b6"></div>
  </div>
    <div class="line gold" id="t6">أثرٌ يبقى</div>
  </section>

  <!-- 7 logo -->
  <section class="scene" id="s7"><div class="world">
    <div class="bg" style="background: radial-gradient(ellipse 55% 40% at 50% 46%, #241b12 0%, #0c0907 55%, #000 100%)"></div>
    <div id="logo">
      <span id="mark" class="gold">عطر</span>
      <div id="atr">ATR</div>
      <div id="maison">MAISON DE PARFUM</div>
      <div id="rule"></div>
      <div id="cta"><svg viewBox="0 0 24 24"><path fill="#F3E3BC" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.89 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89a11.82 11.82 0 0 0-3.48-8.41Z"/></svg>اطلب دلوقتي</div>
      <div id="phone">0128 955 5608</div>
    </div>
  </div></section>

  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="beam"></div>
  <div id="leak"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="fade"></div>

<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const win = (t, a, b, fi, fo) => Math.min(eSine(p(t, a, a + fi)), 1 - eSine(p(t, b - fo, b)));

const BPM = 80, BEAT = 60 / BPM, DURATION = 22.5;
const IMG = n => `b/${n}.png?v=${window.VER || 3}`;
const SIZE = {};   // natural sizes, filled on load

// a bottle element: centre x, floor y, display height
function bottle(parent, name, cx, baseY, H, opt = {}) {
  const [nw, nh] = SIZE[name], W = H * nw / nh;
  const el = document.createElement("div"); el.className = "bt";
  set(el, { left: `${cx - W / 2}px`, top: `${baseY - H}px`, width: `${W}px`, height: `${H}px` });
  el.innerHTML = `${opt.noShadow ? "" : '<div class="shadow"></div>'}${opt.noRefl ? "" : `<img class="refl" src="${IMG(name)}">`}
    <div class="body"><img class="img" src="${IMG(name)}"><img class="hl sheen" src="${IMG(name)}"><img class="hl sweep" src="${IMG(name)}"></div>`;
  if (opt.glow) el.querySelector(".body").style.filter = `drop-shadow(0 0 ${opt.glowR || 34}px ${opt.glow})`;
  parent.appendChild(el);
  return { el, body: el.querySelector(".body"), sweep: el.querySelector(".sweep"), W, H };
}
const sweepAt = (b, k) => { const pos = `${lerp(110, -10, k)}% 0`; b.sweep.style.webkitMaskPosition = pos; b.sweep.style.maskPosition = pos; b.sweep.style.opacity = k <= 0 || k >= 1 ? 0 : .85; };

let B = {};
function build() {
  B.rouge = bottle($("#b2"), "os01", 540, 1450, 1080, { glow: "rgba(255,110,100,.30)" });
  B.blue = bottle($("#b3"), "lv06", 540, 1460, 1120, { glow: "rgba(90,200,255,.35)" });
  B.gold = bottle($("#b4"), "dk06", 540, 1460, 1030, { glow: "rgba(110,70,20,.30)", glowR: 40 });
  // montage: macro framings (display height, fraction of the bottle that sits at frame centre)
  B.m = [["rf04", 2100, .17, "rgba(255,210,140,.45)"], ["lv14", 2600, .30, "rgba(255,80,90,.35)"], ["os02", 1900, .55, "rgba(255,210,140,.35)"], ["lv06", 2700, .55, "rgba(90,200,255,.35)"]]
    .map(([n, H, f, g]) => { const b = bottle($("#b5"), n, 540, 960 + H * (1 - f), H, { glow: g, noRefl: true, noShadow: true }); b.el.style.opacity = 0; return b; });
  // group: V formation, back to front so the centre bottle sits in front
  const G = [["os02", -372, 1385, 640], ["os01", 372, 1385, 640], ["lv06", -196, 1450, 820], ["lv14", 196, 1450, 820], ["dk06", 0, 1535, 760]];
  B.g = G.map(([n, x, y, H]) => bottle($("#b6"), n, 540 + x, y, H, { glow: "rgba(255,220,160,.18)" }));
}

// ---------- gold dust ----------
let seed = 21; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const DUST = Array.from({ length: 140 }, (_, i) => ({ x: rnd() * 1080, y: rnd() * 1920, z: rnd(), ph: rnd() * 6.28, w: 8 + rnd() * 40, bokeh: i < 10 }));
function dust(t, k, dir, tint) {
  const c = $("#dust").getContext("2d"); c.clearRect(0, 0, 1080, 1920); if (k <= 0) return;
  for (const d of DUST) {
    const v = (12 + 50 * d.z) * dir, y = ((d.y - v * t) % 1920 + 1920) % 1920, x = d.x + Math.sin(t * .6 + d.ph) * d.w;
    const r = d.bokeh ? 18 + 30 * d.z : .7 + 2.4 * d.z;
    const tw = .35 + .65 * Math.pow((Math.sin(t * 2.3 + d.ph * 5) + 1) / 2, 2);
    const a = k * tw * (d.bokeh ? .10 : .85);
    const g = c.createRadialGradient(x, y, 0, x, y, r * (d.bokeh ? 1 : 3.2));
    g.addColorStop(0, `rgba(${tint},${a})`); g.addColorStop(d.bokeh ? .7 : .25, `rgba(${tint},${a * (d.bokeh ? .8 : .45)})`); g.addColorStop(1, `rgba(${tint},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r * (d.bokeh ? 1 : 3.2), 0, 6.29); c.fill();
  }
}

// flashes on the beats: [time, strength, decay]
const FLASHES = [[3.0, .95, .45], [9.0, .55, .35], [12.0, .7, .22], [12.75, .45, .18], [13.5, .45, .18], [14.25, .45, .18], [15.0, .9, .5]];
const flashAt = t => FLASHES.reduce((m, [t0, s, d]) => Math.max(m, t < t0 - .06 ? 0 : t < t0 ? s * (1 - (t0 - t) / .06) : s * Math.exp(-(t - t0) / d)), 0);

function frame(t) {
  // global
  set($("#fade"), { opacity: Math.max(1 - eSine(p(t, 0, .8)), eSine(p(t, 21.7, 22.5))) });
  set($("#flash"), { opacity: flashAt(t) });
  set($("#leak"), { opacity: .9 * Math.max(flashAt(t) * .8, 0), backgroundPosition: `${(t * 40) % 100}% 0` });
  set($("#grain"), { backgroundPosition: `${Math.floor(rnd() * 512)}px ${Math.floor(rnd() * 512)}px` });

  // 1. hook: black, a light beam, haze, then the two words
  const s1 = win(t, 0, 3.05, .3, .12);
  set($("#s1"), { opacity: s1 });
  set($("#s1 .world"), { transform: `scale(${1 + .06 * eSine(p(t, 0, 3))})` });
  const bk = p(t, .3, 2.6);
  set($("#beam"), { opacity: t < 3 ? .9 * Math.sin(Math.PI * bk) : 0, transform: `translateX(${lerp(0, 1900, eIO(bk))}px) rotate(18deg)` });
  set($("#s1smoke"), { transform: `translate(${t * 14}px, ${-t * 22}px) scale(1.2)` });
  const a1 = eOut(p(t, 1.5, 2.3)), b1 = eOut(p(t, 2.25, 3.0)), out1 = 1 - eSine(p(t, 2.8, 3.0));
  set($("#t1a"), { opacity: a1 * out1, filter: `blur(${14 * (1 - a1)}px)`, transform: `scale(${1.06 - .06 * a1})` });
  set($("#t1b"), { opacity: b1 * out1, filter: `blur(${14 * (1 - b1)}px)`, transform: `scale(${1.06 - .06 * b1})`, backgroundPosition: `${lerp(100, 20, eSine(p(t, 2.25, 3.0)))}% 0` });

  // 2. rouge: revealed by the flash, slow push-in, slight turn, light sweep; leaves by a focus pull
  const s2 = t >= 2.98 && t < 6.6 ? 1 : 0;
  set($("#s2"), { opacity: s2 });
  if (s2) {
    const k = p(t, 3, 6.4);
    set($("#s2 .world"), { transform: `scale(${1 + .11 * eSine(k)}) translateY(${-30 * eSine(k)}px)`, filter: `blur(${22 * eIn(p(t, 5.7, 6.4))}px)`, opacity: 1 - eSine(p(t, 5.9, 6.5)) });
    set(B.rouge.body, { transform: `perspective(1800px) rotateY(${lerp(9, -4, eIO(k))}deg)` });
    sweepAt(B.rouge, eIO(p(t, 4.1, 5.4)));
    set($("#s2smoke"), { transform: `translate(${-t * 18}px, ${-t * 26}px) scale(1.3)` });
  }

  // 3. la'dor bakhur: racks into focus, slow pan, mist, one line of text
  const s3 = t >= 5.75 && t < 9.0 ? 1 : 0;
  set($("#s3"), { opacity: s3 ? eSine(p(t, 5.75, 6.35)) : 0 });
  if (s3) {
    const k = p(t, 5.75, 9.0);
    set($("#s3 .world"), { transform: `translateX(${lerp(80, -60, eSine(k))}px) scale(${1.04 + .03 * k})`, filter: `blur(${24 * (1 - eOut(p(t, 5.8, 6.7)))}px)` });
    set(B.blue.body, { transform: `perspective(1800px) rotateY(${lerp(-7, 4, eIO(k))}deg)` });
    sweepAt(B.blue, eIO(p(t, 7.0, 8.3)));
    set($("#s3smokeA"), { transform: `translate(${t * 20}px, ${-t * 34}px) scale(1.4)` });
    set($("#s3smokeB"), { transform: `translate(${-t * 16}px, ${-t * 28}px) scale(1.2) rotate(180deg)` });
    const tx = win(t, 6.9, 8.75, .6, .4);
    set($("#t3"), { opacity: tx, filter: `blur(${8 * (1 - eOut(p(t, 6.9, 7.6)))}px)`, transform: `translateY(${18 * (1 - eOut(p(t, 6.9, 7.6)))}px)` });
  }

  // 4. kahilan on cream: match cut on the beat, slow pull-back, warm sweep
  const s4 = t >= 9.0 && t < 12.1 ? 1 : 0;
  set($("#s4"), { opacity: s4 });
  if (s4) {
    const k = p(t, 9, 12);
    set($("#s4 .world"), { transform: `scale(${1.16 - .14 * eOut(k)}) translateX(${lerp(-50, 0, eOut(k))}px)`, opacity: 1 - eSine(p(t, 11.8, 12.05)) });
    set(B.gold.body, { transform: `perspective(1800px) rotateY(${lerp(5, -5, eIO(k))}deg)` });
    sweepAt(B.gold, eIO(p(t, 9.9, 11.3)));
    set($("#s4smoke"), { transform: `translate(${t * 12}px, ${-t * 20}px) scale(1.3)` });
  }

  // 5. montage: one macro shot per beat
  const s5 = t >= 12.0 && t < 15.0 ? 1 : 0;
  set($("#s5"), { opacity: s5 });
  if (s5) {
    const i = Math.min(3, Math.floor((t - 12) / BEAT)), k = (t - 12 - i * BEAT) / BEAT;
    B.m.forEach((b, j) => { b.el.style.opacity = j === i ? 1 : 0; });
    const b = B.m[i], dir = i % 2 ? -1 : 1;
    set($("#w5"), { transform: `scale(${1 + .07 * eSine(k)}) translate(${dir * lerp(-24, 24, k)}px, ${lerp(16, -16, k)}px)` });
    set(b.body, { transform: `perspective(2200px) rotateY(${dir * lerp(-4, 4, k)}deg)` });
    sweepAt(b, eIO(clamp(k * 1.25)));
  }

  // 6. group: big hit, slow pull-back and descent
  const s6 = t >= 14.98 && t < 18.5 ? 1 : 0;
  set($("#s6"), { opacity: s6 });
  if (s6) {
    const k = p(t, 15, 18.2);
    set($("#w6"), { transform: `scale(${1.32 - .32 * eOut(k)}) translateY(${lerp(-140, 0, eOut(k))}px)`, filter: `blur(${16 * eIn(p(t, 17.6, 18.4))}px)`, opacity: 1 - eSine(p(t, 17.8, 18.45)) });
    B.g.forEach((b, j) => sweepAt(b, eIO(p(t, 15.6 + j * .12, 16.9 + j * .12))));
    set($("#s6smoke"), { transform: `translate(${t * 10}px, ${-t * 15}px) scale(1.3)` });
    const tx = win(t, 15.9, 18.0, .7, .4);
    set($("#t6"), { opacity: tx, filter: `blur(${10 * (1 - eOut(p(t, 15.9, 16.7)))}px)`, backgroundPosition: `${lerp(100, 0, eSine(p(t, 15.9, 17.9)))}% 0` });
  }

  // 7. logo and call to action
  const s7 = t >= 18.0 ? 1 : 0;
  set($("#s7"), { opacity: s7 ? eSine(p(t, 18.0, 18.6)) : 0 });
  if (s7) {
    set($("#s7 .world"), { transform: `scale(${1 + .04 * eSine(p(t, 18, 22.5))})` });
    const m = eOut(p(t, 18.1, 19.2));
    set($("#mark"), { opacity: m, filter: `blur(${12 * (1 - m)}px)`, transform: `scale(${1.05 - .05 * m})`, backgroundPosition: `${lerp(100, 0, eIO(p(t, 19.0, 20.4)))}% 0` });
    const n = eOut(p(t, 18.6, 19.5));
    set($("#atr"), { opacity: n, letterSpacing: `${lerp(.5, .32, n)}em` }); set($("#maison"), { opacity: eOut(p(t, 18.9, 19.7)) });
    set($("#rule"), { width: `${520 * eIO(p(t, 19.4, 20.2))}px` });
    const c = eOut(p(t, 19.8, 20.5));
    set($("#cta"), { opacity: c, transform: `translateY(${22 * (1 - c)}px)`, boxShadow: `0 0 ${40 * c}px rgba(212,175,106,${.18 * c})` });
    const ph = eOut(p(t, 20.3, 21.0));
    set($("#phone"), { opacity: ph, transform: `translateY(${16 * (1 - ph)}px)` });
  }

  // particles: drift up at the start, fall in the group shot, fewer in the montage
  const dk = t < 12 ? 1 : t < 15 ? .45 : 1;
  const dir = t >= 15 && t < 18 ? -1 : 1;
  dust(t, dk * (t >= 9 && t < 12 ? .8 : 1), dir, t >= 9 && t < 12 ? "190,140,60" : "255,225,170");
}

async function init() {
  const names = ["os01", "os02", "rf04", "dk06", "lv06", "lv14"];
  await Promise.all(names.map(n => new Promise(r => { const i = new Image(); i.onload = () => { SIZE[n] = [i.naturalWidth, i.naturalHeight]; r(); }; i.src = IMG(n); })));
  build();
  await document.fonts.load("700 100px Ruqaa", "عطر"); await document.fonts.load("700 100px Amiri", "عطرك"); await document.fonts.load("500 100px Cinzel", "ATR");
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  window.READY = true;
}
window.render = t => { seed = 21 + Math.floor(t * 30) * 7; frame(t); };
window.DURATION = DURATION;
init();
</script>
