<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #000; }
.full { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.world { position: absolute; inset: 0; transform-origin: 50% 45%; }
.bg { position: absolute; inset: -12%; }
.bt { position: absolute; }
.bt .body { position: absolute; inset: 0; }
.bt .img { position: absolute; inset: 0; width: 100%; height: 100%; }
.bt .hl { position: absolute; inset: 0; width: 100%; height: 100%; }
.bt .sheen { filter: brightness(1.9) saturate(.7); opacity: .2;
  -webkit-mask-image: linear-gradient(90deg, transparent 10%, #000 19%, transparent 28%, transparent 73%, rgba(0,0,0,.6) 81%, transparent 89%); }
.bt .sweep { filter: brightness(2.5) saturate(.55); opacity: 0;
  -webkit-mask-image: linear-gradient(100deg, transparent 0%, transparent 43%, #000 50%, transparent 57%, transparent 100%);
  -webkit-mask-size: 320% 100%; -webkit-mask-repeat: no-repeat; }
.bt .refl { position: absolute; left: 0; top: 100%; width: 100%; height: 100%; transform: scaleY(-1); opacity: .24; filter: blur(1.5px);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 36%); }
.bt .shadow { position: absolute; left: -20%; right: -20%; top: calc(100% - 3%); height: 6%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.85), rgba(0,0,0,0)); filter: blur(6px); }
.cone { position: absolute; left: 50%; top: -8%; transform: translateX(-50%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  background: linear-gradient(to bottom, rgba(255,232,196,.26), rgba(255,232,196,.05) 70%, rgba(255,232,196,0)); filter: blur(30px); mix-blend-mode: screen; }
.floor { position: absolute; left: -10%; right: -10%; height: 60%; background: linear-gradient(to bottom, rgba(255,240,215,.06), rgba(0,0,0,0) 40%); }
.smoke { position: absolute; background: url(tex/smoke.png) center / 100% 100% no-repeat; mix-blend-mode: screen; }
#vignette { position: absolute; inset: 0; }
#grain { display: none; } /* no grain on the website film: it reads as noise and costs file size */
canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <section class="scene" id="sA"><div class="world" id="wA">
    <div class="bg" style="background: radial-gradient(ellipse 60% 55% at 50% 42%, #221a13 0%, #0c0907 55%, #020202 92%)"></div>
    <div class="cone" id="coneA"></div>
    <div class="floor" id="floorA"></div>
    <div class="smoke" id="smA" style="opacity:.12; filter: sepia(1) saturate(1.8)"></div>
    <div id="bA"></div>
  </div></section>

  <section class="scene" id="sB"><div class="world" id="wB">
    <div class="bg" style="background: radial-gradient(ellipse 55% 55% at 50% 40%, #4a1218 0%, #22070a 48%, #060203 90%)"></div>
    <div class="cone" id="coneB"></div>
    <div class="floor" id="floorB"></div>
    <div id="bBback"></div>
    <div class="smoke" id="smB" style="opacity:.2; filter: sepia(1) hue-rotate(-30deg) saturate(3) brightness(.7)"></div>
    <div id="bB"></div>
  </div></section>

  <section class="scene" id="sC"><div class="world" id="wC">
    <div class="bg" style="background: radial-gradient(ellipse 60% 55% at 52% 40%, #10394a 0%, #081a24 48%, #020608 90%)"></div>
    <div class="bg" style="background: radial-gradient(circle at 20% 30%, rgba(255,200,130,.16), rgba(255,200,130,0) 35%)"></div>
    <div class="floor" id="floorC"></div>
    <div id="bCback"></div>
    <div class="smoke" id="smC1" style="opacity:.22; filter: sepia(.6) hue-rotate(160deg) saturate(1.6) brightness(.9)"></div>
    <div class="smoke" id="smC2" style="opacity:.15; filter: sepia(.6) hue-rotate(160deg) saturate(1.6) brightness(.9)"></div>
    <div id="bC"></div>
  </div></section>

  <section class="scene" id="sD"><div class="world" id="wD">
    <div class="bg" style="background: radial-gradient(ellipse 58% 55% at 50% 40%, #5a3d1c 0%, #2a1b0c 45%, #090604 90%)"></div>
    <div class="cone" id="coneD"></div>
    <div class="floor" id="floorD"></div>
    <div id="bDback"></div>
    <div class="smoke" id="smD" style="opacity:.16; filter: sepia(1) saturate(2.4) brightness(.95)"></div>
    <div id="bD"></div>
  </div></section>

  <canvas id="dust"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>

<script>
const q = new URLSearchParams(location.search), W = +q.get("w") || 1920, H = +q.get("h") || 1080;
const WIDE = W / H > 1.2;
document.documentElement.style.cssText = `width:${W}px;height:${H}px`; document.body.style.cssText = `width:${W}px;height:${H}px;position:relative`;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const eOut = x => 1 - Math.pow(1 - x, 3);
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const T = 14, TAU = Math.PI * 2;                  // loop length: every motion below repeats exactly every T seconds
const IMG = n => `b/${n}.png?v=3`, SIZE = {};
// pre-filtered sizes of each bottle (made with Lanczos), so the browser never shrinks fine details such as ribbed glass
// by much: it picks the smallest one that is still at least as tall as the bottle will be drawn, camera push included
const MIPS = [500, 650, 800, 1000, 1250, 1550, 1900];
const pick = (n, h) => { const need = h * (window.devicePixelRatio || 1) * 1.12, m = MIPS.find(v => v >= need && v < SIZE[n][1]); return m ? `b/mip/${n}_${m}.png?v=5` : IMG(n); };

// layout: floor line and hero height, as fractions of the frame
const FLOOR = H * (WIDE ? .64 : .58), HERO = H * (WIDE ? .47 : .42);
function bottle(parent, name, cx, baseY, h, opt = {}) {
  const [nw, nh] = SIZE[name], w = h * nw / nh;
  const el = document.createElement("div"); el.className = "bt";
  set(el, { left: `${cx - w / 2}px`, top: `${baseY - h}px`, width: `${w}px`, height: `${h}px` });
  const src = pick(name, h);
  el.innerHTML = `${opt.noShadow ? "" : '<div class="shadow"></div>'}<img class="refl" src="${src}">
    <div class="body"><img class="img" src="${src}"><img class="hl sheen" src="${src}"><img class="hl sweep" src="${src}"></div>`;
  if (opt.glow) el.querySelector(".body").style.filter = `drop-shadow(0 0 ${Math.round(H * .03)}px ${opt.glow})`;
  if (opt.css) set(el, opt.css);
  parent.appendChild(el);
  return { el, body: el.querySelector(".body"), sweep: el.querySelector(".sweep") };
}
const sweepAt = (b, k) => { b.sweep.style.webkitMaskPosition = `${lerp(110, -10, k)}% 0`; b.sweep.style.opacity = k <= 0 || k >= 1 ? 0 : .8; };

let B = {};
function build() {
  const cx = W / 2;
  // shared set pieces
  ["A", "B", "D"].forEach(s => set($(`#cone${s}`), { width: `${W * (WIDE ? .9 : 1.3)}px`, height: `${H * 1.1}px` }));
  ["A", "B", "C", "D"].forEach(s => set($(`#floor${s}`), { top: `${FLOOR - 4}px` }));
  document.querySelectorAll(".smoke").forEach(e => set(e, { width: `${Math.max(W, H) * 1.3}px`, height: `${Math.max(W, H) * 1.6}px`, left: `${-W * .15}px`, top: `${H * .2}px` }));
  $("#dust").width = W; $("#dust").height = H;
  $("#vignette").style.background = `radial-gradient(ellipse ${WIDE ? "75% 85%" : "85% 70%"} at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,.5) 85%, rgba(0,0,0,.8) 100%)`;

  // A: group in a V (wide: a longer line with room to glide)
  const gap = WIDE ? H * .27 : W * .19, hs = [.80, .90, 1, .90, .80], names = ["os02", "lv06", "dk06", "lv14", "os01"], dy = [-.05, -.02, 0, -.02, -.05];
  const order = [0, 4, 1, 3, 2];  // draw back to front
  if (WIDE) {  // two more, far back and out of focus, to fill the widescreen
    bottle($("#bA"), "rf04", cx - 2.95 * gap, FLOOR - H * .1, HERO * .5, { css: { filter: "blur(7px) brightness(.45)" }, noShadow: true });
    bottle($("#bA"), "lv06", cx + 2.95 * gap, FLOOR - H * .1, HERO * .5, { css: { filter: "blur(7px) brightness(.45)" }, noShadow: true });
  }
  B.g = order.map(i => bottle($("#bA"), names[i], cx + (i - 2) * gap, FLOOR + H * dy[i], HERO * (WIDE ? .9 : .78) * hs[i], { glow: "rgba(255,220,160,.16)" }));
  // B: rouge, with soft out-of-focus bottles far behind
  const back = (parent, list) => list.forEach(([n, fx, s]) => bottle(parent, n, cx + fx * W, FLOOR - H * .14, HERO * s, { css: { filter: "blur(9px) brightness(.45)" }, noShadow: true }));
  back($("#bBback"), WIDE ? [["os02", -.27, .62], ["lv14", .27, .62]] : [["os02", -.36, .55], ["lv14", .36, .55]]);
  B.rouge = bottle($("#bB"), "os01", cx, FLOOR, HERO * 1.08, { glow: "rgba(255,110,100,.28)" });
  back($("#bCback"), WIDE ? [["lv14", -.28, .6], ["os01", .28, .6]] : [["lv14", -.37, .55], ["os01", .37, .55]]);
  B.blue = bottle($("#bC"), "lv06", cx, FLOOR, HERO * 1.12, { glow: "rgba(90,200,255,.32)" });
  back($("#bDback"), WIDE ? [["rf04", -.27, .6], ["os02", .27, .6]] : [["rf04", -.36, .55], ["os02", .36, .55]]);
  B.gold = bottle($("#bD"), "dk06", cx, FLOOR, HERO * 1.0, { glow: "rgba(255,200,120,.30)" });
}

// gold dust: every particle's path repeats every T seconds, so the loop is seamless
let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const DUST = Array.from({ length: 120 }, (_, i) => ({ x: rnd(), y: rnd(), z: rnd(), ph: rnd() * TAU, k: 1 + Math.floor(rnd() * 2), sway: 6 + rnd() * 30, bokeh: i < 9 }));
function dust(t) {
  const c = $("#dust").getContext("2d"); c.clearRect(0, 0, W, H);
  for (const d of DUST) {
    const y = (((d.y - d.k * t / T) % 1) + 1) % 1 * (H * 1.1) - H * .05;
    const x = d.x * W + Math.sin(TAU * t / T * 2 + d.ph) * d.sway;
    const r = d.bokeh ? H * (.015 + .03 * d.z) : .7 + 2.2 * d.z;
    const tw = .35 + .65 * Math.pow((Math.sin(TAU * t / T * 6 + d.ph * 5) + 1) / 2, 2);
    const a = tw * (d.bokeh ? .08 : .75), R = r * (d.bokeh ? 1 : 3.2);
    const g = c.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(255,225,170,${a})`); g.addColorStop(d.bokeh ? .7 : .25, `rgba(255,225,170,${a * (d.bokeh ? .8 : .45)})`); g.addColorStop(1, "rgba(255,225,170,0)");
    c.fillStyle = g; c.beginPath(); c.arc(x, y, R, 0, 6.29); c.fill();
  }
}
const drift = (el, t, ax, ay, ph = 0) => set(el, { transform: `translate(${Math.sin(TAU * t / T + ph) * ax}px, ${Math.cos(TAU * t / T + ph) * ay}px) scale(1.2)` });

// timeline (seconds): A group 0-3.9 and again 13.2-14 (so 14 joins 0), B rouge 3.4-7.4, C blue 6.9-10.9, D gold 10.4-13.9
function frame(t) {
  t = ((t % T) + T) % T;
  // A — group: slow dolly across, the camera phase wraps so the end matches the start
  const tA = t > 7 ? t - T : t;                     // -0.8 .. 3.9
  const kA = p(tA, -0.8, 3.9);
  const oA = t > 7 ? eSine(p(t, 13.55, 14)) : 1 - eSine(p(t, 3.25, 3.75));
  set($("#sA"), { opacity: oA });
  set($("#wA"), { transform: `translateX(${lerp(W * .02, -W * .02, kA)}px) scale(${1.04 + .02 * kA})`, filter: `blur(${8 * eSine(p(t, 3.25, 3.75)) * (t < 7) + 8 * (1 - eSine(p(t, 13.55, 14))) * (t > 7)}px)` });
  B.g.forEach((b, j) => sweepAt(b, eSine(p(tA, .2 + j * .15, 1.6 + j * .15))));
  drift($("#smA"), t, W * .03, H * .03);

  // B — rouge: dissolve in through a soft focus pull, slow push-in, light sweep
  const oB = t >= 3.6 && t < 7.3 ? Math.min(eSine(p(t, 3.6, 4.2)), 1 - eSine(p(t, 6.75, 7.25))) : 0;
  set($("#sB"), { opacity: oB });
  if (oB) {
    const k = p(t, 3.4, 7.4);
    set($("#wB"), { transform: `scale(${1 + .07 * eSine(k)})`, filter: `blur(${10 * (1 - eOut(p(t, 3.6, 4.5))) + 8 * eSine(p(t, 6.75, 7.25))}px)` });
    set(B.rouge.body, { transform: `perspective(${H * 2}px) rotateY(${lerp(7, -4, eSine(k))}deg)` });
    sweepAt(B.rouge, eSine(p(t, 4.6, 6.0)));
    drift($("#smB"), t, W * .04, H * .04, 1);
  }
  // C — la'dor bakhur: racks into focus, slow pan, mist
  const oC = t >= 7.1 && t < 10.8 ? Math.min(eSine(p(t, 7.1, 7.7)), 1 - eSine(p(t, 10.25, 10.75))) : 0;
  set($("#sC"), { opacity: oC });
  if (oC) {
    const k = p(t, 6.9, 10.9);
    set($("#wC"), { transform: `translateX(${lerp(W * .03, -W * .03, eSine(k))}px) scale(1.04)`, filter: `blur(${14 * (1 - eOut(p(t, 7.1, 8.1))) + 8 * eSine(p(t, 10.25, 10.75))}px)` });
    set(B.blue.body, { transform: `perspective(${H * 2}px) rotateY(${lerp(-6, 4, eSine(k))}deg)` });
    sweepAt(B.blue, eSine(p(t, 8.0, 9.4)));
    drift($("#smC1"), t, W * .05, H * .05, 2); drift($("#smC2"), t, -W * .04, H * .04, 3);
  }
  // D — kahilan on warm amber: slow pull-back, sweep, then dissolves into the group (the loop point)
  const oD = t >= 10.6 && t < 13.75 ? Math.min(eSine(p(t, 10.6, 11.2)), 1 - eSine(p(t, 13.2, 13.7))) : 0;
  set($("#sD"), { opacity: oD });
  if (oD) {
    const k = p(t, 10.4, 13.9);
    set($("#wD"), { transform: `scale(${1.1 - .08 * eOut(k)})`, filter: `blur(${10 * (1 - eOut(p(t, 10.6, 11.5))) + 8 * eSine(p(t, 13.2, 13.7))}px)` });
    set(B.gold.body, { transform: `perspective(${H * 2}px) rotateY(${lerp(5, -5, eSine(k))}deg)` });
    sweepAt(B.gold, eSine(p(t, 11.3, 12.7)));
    drift($("#smD"), t, W * .03, H * .04, 4);
  }
  set($("#grain"), { backgroundPosition: `${Math.floor(rnd() * 512)}px ${Math.floor(rnd() * 512)}px` });
  dust(t);
}

async function init() {
  const names = ["os01", "os02", "rf04", "dk06", "lv06", "lv14"];
  await Promise.all(names.map(n => new Promise(r => { const i = new Image(); i.onload = () => { SIZE[n] = [i.naturalWidth, i.naturalHeight]; r(); }; i.src = IMG(n); })));
  build();
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  window.READY = true;
}
window.render = t => { seed = 9 + Math.floor(t * 30) * 13; frame(t); };
window.DURATION = T;
init();
</script>
</body>
</html>
